    <style>
     /* 核心变量定义 */
      :root {
        --bg-gradient: linear-gradient(
          45deg,
          #330b68 0%,
          #325b93 30%,
          #30cccf 100%
        );
        --n-bezier: cubic-bezier(0.4, 0, 0.2, 1);
        --glass: rgba(255, 255, 255, 0.1);
        --glass-heavy: rgba(255, 255, 255, 0.2);
        --primary: #30cccf;
        --radius-card: 16px;
      }

      /* === 新增：暗夜黑主题变量覆盖 === */
      [data-theme="dark"] {
        --bg-gradient: linear-gradient(
          135deg, 
          #141e30 0%, 
          #243b55 100%
        );
        --primary: #6366f1; /* 可选：同步修改高亮主色调 */
      }

      /* === 新增：落日暖主题变量覆盖 === */
      [data-theme="warm"] {
        /* 高评分：落日暮色渐变 */
        --bg-gradient: linear-gradient(
          135deg, 
          #2c1a3a 0%,    /* 深紫底色 */
          #8e44ad 40%,   /* 柔和紫红 */
          #ff7675 75%,   /* 落日珊瑚粉 */
          #ffeaa7 100%   /* 极淡的奶杏黄，作为边缘高亮层 */
        );
        --primary: #ff7675; /* 同步修改主卡片高亮色 */
      }

      [data-theme="green"] {
        /* 高评分：极光森林绿渐变 */
        --bg-gradient: linear-gradient(
          135deg,
          #0b131a 0%,    /* 极深夜蓝 */
          #132c2a 50%,   /* 暗森林绿 */
          #1abc9c 100%   /* 极光青绿 */
        );
        --primary: #1abc9c;
      }

      /* 确保您的 body 绑定了该变量并拥有平滑过渡 */
      body {
        background: var(--bg-gradient) !important;
        background-size: cover;
        background-attachment: fixed;
        transition: background 0.8s var(--n-bezier); /* 使用您现有的贝塞尔曲线 */
        margin: 0;
        height: 100vh;
      }

      /* 基础布局 */
      body,
      html {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg-gradient) fixed;
        color: white;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      /* 右上角纯图标定位 */
.theme-switcher-wrapper {
  position: absolute;
  top: 25px;
  right: 25px;
  z-index: 9999;
}

/* 彻底剥离圆形外圈及多余属性 */
#theme-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  padding: 0;
  margin: 0;
  cursor: pointer;
  outline: none;
  box-shadow: none;
  transition: transform 0.3s var(--n-bezier);
}

/* 图标基础样式（如果图标默认是黑色的） */
.theme-icon {
  width: 24px;
  height: 24px;
  /* 默认主题下（浅蓝/紫绿渐变）：强制显示为带有高级感的“极光青色 #30cccf” */
  filter: invert(79%) sepia(33%) saturate(1637%) hue-rotate(135deg) brightness(97%) contrast(87%);
  transition: transform 0.6s var(--n-bezier), filter 0.5s var(--n-bezier), opacity 0.3s var(--n-bezier);
}

/* === 核心：根据不同主题，强制变换图标颜色 === */

/* 当切换到【暗夜黑】主题时 */
[data-theme="dark"] .theme-icon {
  /* 强制显示为现代流行 UI 高级灰蓝色（Slate-400 质感 #94a3b8） */
  filter: invert(72%) sepia(9%) saturate(583%) hue-rotate(174deg) brightness(88%) contrast(85%);
}

/* 当切换到【落日暮色】主题时 */
[data-theme="warm"] .theme-icon {
  /* 强制显示为柔和淡暖杏色（#fce2cb），防止在红紫渐变背景下显得太突兀 */
  filter: invert(93%) sepia(13%) saturate(1067%) hue-rotate(320deg) brightness(101%) contrast(98%);
}

/* 悬停与点击动效 */
#theme-btn:hover .theme-icon {
  transform: scale(1.1) rotate(90deg);
  opacity: 0.9;
}

#theme-btn:active .theme-icon {
  transform: scale(0.9) rotate(90deg);
}

      /* 1. 顶部紧凑化：减少空白 */
      /* 顶部英雄区容器 */
      .hero-section {
        width: 100%;
        padding: 88px 0 40px 0;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: visible !important;
      }

      /* 时间样式：调整为 80px，追求极致清秀 */
      #time {
        display: block;
        font-size: 88px; /* 核心修改：设定为 88px */
        font-weight: 200; /* 保持轻盈细体 */
        margin: 0;
        line-height: 1;
        letter-spacing: 0.03em; /* 稍微增加字间距，让小字号更舒展 */
        color: #ffffff;
        text-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        cursor: default;
        transition: all 0.5s var(--n-bezier);
      }

      #time:hover {
        transform: translateY(-3px);
        text-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      }

      /* 日期行容器：实现 1~2 字符的黄金间距 */
      #date-info {
        font-size: 16px; /* 相应调小日期字号，保持 1:5.7 的优雅比例 */
        margin-top: 12px; /* 紧凑间距 */
        margin-bottom: 35px;
        opacity: 0.75;
        font-weight: 300;

        display: flex;
        justify-content: space-between; /* 两端对齐 */

        /* 物理对齐核心：
       88px 细体时间总宽约为 195px。
       三段文字(约12字)总宽约 168px。
       剩余 27px 分给两个间隙，每个间隙 13.5px。
       13.5px / 14px ≈ 0.96个字符间距，完美符合要求。 */
        width: 195px;

        letter-spacing: 0.2px;
      }

      #date-info span {
        white-space: nowrap;
        flex: 0 0 auto;
      }

      /* 搜索包装器：确保层级正确 */
      .search-wrapper {
        width: 90%;
        max-width: 800px;
        margin: 0 auto;
        position: relative;
        z-index: 2000;
      }
      /* 搜索栏整体包装器 */
      .search-wrapper {
        width: 90%;
        max-width: 800px;
        margin: 0 auto;
        margin-top: 10px;
        position: relative; /* 确保子元素定位参考 */
        z-index: 2000; /* 提升整个搜索区域的层级 */
      }
      /* 搜索栏核心容器：深度优化后的对齐方式 */
      .search-bar {
        position: relative;
        height: 54px; /* 稍微加高一点，比例更协调 */
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(30px);
        border-radius: 27px;
        display: flex;
        align-items: center;
        padding: 0 20px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: all 0.4s var(--n-bezier);
      }
      .search-bar:focus-within {
        background: var(--glass-heavy);
        border-color: var(--primary);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      }
      .search-bar input {
        background: none;
        border: none;
        color: white;
        width: 100%;
        outline: none;
        font-size: 18px;
      }

      /* 2. 核心内容区：占 80% 宽度 */
      .main-container {
        width: 80%;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-bottom: 80px;
      }

      .content-panel {
        width: 100%;
        display: none;
      }
      .content-panel.active {
        display: block;
        animation: slideIn 0.5s var(--n-bezier);
      }

      /* 3. 卡片布局：1:1:3:1 比例 */
      .home-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 3fr 1fr; /* 1:1:3:1 比例 */
        gap: 20px;
        margin-bottom: 40px;
        width: 100%;
        /* 核心修改：统一规定这一行网格的绝对高度为 160px（您可以根据喜好自由调整这个数值，比如 140px 或 160px） */
        grid-auto-rows: 160px !important;
        /* 核心修改：强制让内部所有子卡片纵向拉伸，填满这 160px 的网格高度 */
        align-items: stretch !important;
      }
      .card {
        background: var(--glass);
        backdrop-filter: blur(15px);
        padding: 25px 20px;
        border-radius: var(--radius-card);
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: all 0.3s var(--n-bezier);
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        height: 120px; /* 固定高度保持整齐 */
      }
      .card:hover {
        background: var(--glass-heavy);
        transform: translateY(-5px);
        border-color: var(--primary);
      }
      .card-title {
        font-size: 12px;
        opacity: 0.5;
        margin-bottom: 8px;

      }
      .card-value {
        font-size: 20px;

        line-height: 1.4;
      }

      /* 热搜列表简单模拟 */
      .trending-list {
        font-size: 14px;

        padding: 0 10px;

      }
      .trending-item {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;

        margin-bottom: 4px;
      }

      /* 网址图标 */
      .site-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
        gap: 20px;
        width: 100%;
      }
      .site-item {
        text-align: center;
        text-decoration: none;
        color: white;
        transition: 0.3s var(--n-bezier);
      }
      .site-item:hover {
        transform: scale(1.1);
      }
      .site-icon {
        width: 56px;
        height: 56px;
        background: var(--glass);
        border-radius: 14px;
        margin: 0 auto 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .site-name {
        font-size: 12px;
        opacity: 0.8;
      }

      /* 4. 底部导航：宽度随内容自适应，居中显示 */
      .sidebar {
        position: fixed;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%); /* 水平居中 */
        width: auto; /* 取消占满，随内容伸缩 */
        height: 42px; /* 进一步减矮，更显精致 */
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(20px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 100;
        padding: 0 10px; /* 两侧留出一点间隙 */
        border-radius: 8px 8px 0 0; /* 仅顶部微小圆角，底部直角 */
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-bottom: none;
      }

      .nav-item {
        position: relative;
        padding: 0 20px; /* 缩小间距，使长度仅比文字略大 */
        cursor: pointer;
        font-size: 14px;
        opacity: 0.6;
        transition: all 0.3s var(--n-bezier);
        height: 100%;
        display: flex;
        align-items: center;
        white-space: nowrap;
      }

      .nav-item.active {
        opacity: 1;
        color: var(--primary);
        font-weight: 500;
      }

      /* 激活状态指示器：底部线条与文字对齐 */
      .nav-item.active::after {
        content: "";
        position: absolute;
        left: 20px;
        right: 20px;
        bottom: 0;
        height: 3px;
        background: var(--primary);
        border-radius: 2px 2px 0 0;
      }

      /* 弹窗 */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(10px);
      }
      .modal-content {
        background: white;
        color: #333;
        padding: 35px;
        border-radius: 20px;
        width: 400px;
        position: relative;
        animation: zoomIn 0.3s var(--n-bezier);
      }
      .close-btn {
        position: absolute;
        right: 20px;
        top: 15px;
        cursor: pointer;
        font-size: 24px;
        color: #aaa;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes zoomIn {
        from {
          transform: scale(0.95);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

        margin-right: 10px;

      .bg-red {
        background: #ef4444;
      }
      .bg-purple {
        background: #9333ea;
      }
      .bg-blue {
        background: #2563eb;
      }

      /* 底部方位与物候 */

        margin-top: 15px;
        padding-top: 12px;
        text-align: left;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        font-size: 11px;
        color: #555; /* 方位文字加深 */

      .watermark-month {

      .grid-header span:hover {
        color: #3b82f6;
      }
      /* 给今天加一个微弱的标识 */
      .today-mark::after {
        content: "";

        height: 4px;
        background: #3b82f6;
        border-radius: 50%;

      .day-cell.is-red .lunar-small {
        color: #ff5a5f;
        opacity: 0.8;
      }

      /* 核心细节：如果红色日期被选中（current），文字应变回白色以便在蓝色背景下看清 */
      .day-cell.current.is-red {
        color: #fff !important;
      }
      .day-cell.current.is-red .lunar-small {
        color: #fff !important;
        opacity: 0.9;
      }

      /* 其他月份的红色日期应保持极淡，不干扰视线 */
      .day-cell.other-month.is-red {
        opacity: 0.2;

      /* 热搜(3)CSS */
      .trending-card {

        flex-direction: column !important;
        justify-content: flex-start !important;
        text-align: left !important;
        height: 100% !important;
        box-sizing: border-box !important;
        overflow: hidden !important;
      }

      /* tabs */
      .trending-tabs {
        display: flex !important;
        gap: 12px !important;
        margin-bottom: 10px !important;
        font-size: 12px !important;
        justify-content: flex-start !important;
      }

      /* tab */
      .tab-item {
        cursor: pointer;
        opacity: 0.65;
        transition: opacity .2s ease, color .2s ease, transform .2s ease;
        user-select: none;
      }
      .tab-item:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }
      .tab-item.active {
        opacity: 1;
        font-weight: 600;
        color: var(--primary, #3b82f6);
      }

      /* list */
      .trending-list-v2 {
        display: flex !important;
        flex-direction: column !important;
        gap: 6px !important;
        width: 100% !important;
        flex: 1 !important;
        min-height: 0 !important;
      }

      /* row */
      .trending-row {
        display: flex !important;
        align-items: center !important;
        font-size: 13px !important;
        text-decoration: none !important;
        color: rgba(255, 255, 255, .88) !important;
        line-height: 1.3 !important;
        padding: 3px 0 !important;
        text-align: left !important;
        box-sizing: border-box !important;
        transition: transform .18s ease, color .18s ease, opacity .18s ease;

      }
      .trending-row:hover {
        transform: translateX(2px);
        color: #fff !important;
        opacity: 1;
      }

      /* 排名 */
      .rank-num {
        min-width: 18px;
        font-size: 12px;
        font-weight: 700;
        color: #3b82f6;

        flex-shrink: 0;

      .trending-row:nth-child(2) .rank-num { color: #ff9f43; }
      .trending-row:nth-child(3) .rank-num { color: #feca57; }

      /* title */
      .trend-text {
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
        flex: 1 !important;
        text-align: left !important;
        letter-spacing: .1px;
      }

      /* loading */
      .loading-text {
        font-size: 12px;
        color: rgba(255, 255, 255, .45);
      }

      /* 下班倒计时(4) */
      .status-card {
        background: #ffffff !important;
        color: #333 !important;
        padding: 15px 20px !important;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        overflow: hidden;
        text-align: left !important;
        cursor: default !important;
        box-sizing: border-box;
        /* 核心修改 1：为卡片建立绝对定位基准，且强制声明为块级，顺应上一级 main 的 block 属性 */
        position: relative !important;
        display: block !important;
        /* 核心修改：删掉 height: 140px; 改为 100% 自适应 */
        height: 100% !important;
      }

      /* 核心修改 2：限制左侧整体容器的宽度，死死卡在 60%，绝不允许它向右溢出 */
      .status-left-container {
        width: 60% !important;
        height: 100% !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: center !important;
      }

      .status-main-title {
        font-size: 20px;
        font-weight: 600;
        color: #666;
        margin-bottom: 5px;
      }

      .status-big-time {
        font-size: 14px;
        font-weight: 800;
        color: #333;
        margin-bottom: 15px;
        min-height: 20px;
      }

      /* 核心修改：底部灰色方块群，强制所有小卡片一律紧密靠左排列 */
      .status-footer {
        display: flex !important;
        gap: 8px !important;
        justify-content: flex-start !important; /* 统一靠左 */
      }

      /* 核心修改：让灰色小方块宽度自适应文字，比字体略大 */
      .mini-box {
        background: #f5f5f5;
        /* 调整上下和左右内边距：上下6px，左右8px，确保边缘只比字体略大一点点 */
        padding: 6px 8px !important;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;

        width: fit-content !important; /* 关键：宽度由内部文字内容决定 */
        min-width: unset !important; /* 清除之前设置的固定最小宽度约束 */
        flex: unset !important; /* 坚决不参与任何拉伸或平分 */
      }

      .mini-label {
        font-size: 10px;
        color: #999;
        margin-bottom: 2px;
        white-space: nowrap; /* 防止字数多时换行影响宽度计算 */
      }
      .mini-value {
        font-size: 13px;
        font-weight: bold;
        color: #444;
        white-space: nowrap; /* 防止字数多时换行影响宽度计算 */
      }

      /* 核心修改 3：右侧独立图片区改用绝对定位，参照物为 .status-card（因为加了 position: relative） */
      /* 这样无论上一级 main 怎么干扰，它都只能乖乖待在卡片的右侧正中间，绝对不可能掉到下方 */
      .status-image-box {
        position: absolute !important;
        right: 20px !important; /* 距离卡片右边框 20px */
        top: 50% !important; /* 定位到垂直中心 */
        transform: translateY(
          -50%
        ) !important; /* 向上修正自身高度的一半，达到像素级垂直居中 */

        width: 75px !important; /* 限制宽度 */
        height: 75px !important; /* 限制高度 */
        display: flex !important;

        justify-content: center !important; /* 内部图片水平居中 */

      .status-image-box img {
        width: 100% !important;
        height: 100% !important;
        object-fit: contain !important; /* 保持图片原有比例不拉伸 */
      }

          <div class="week-days">
            <span>日</span><span>一</span><span>二</span><span>三</span
            ><span>四</span><span>五</span><span>六</span>
          </div>
          <div id="calendar-days-wrapper" class="days-grid">
            <!-- 由 JS 动态生成 -->
          </div>
          <!-- 大数字水印 -->
          <div id="m-deco-month" class="watermark-month">5</div>
        </div>

        <!-- 右侧：详情面板 -->
        <div class="calendar-panel-right">
          <div id="p-full-date" class="p-date"></div>
          <div class="p-blue-box">
            <span class="day-number">--</span>
          </div>
          <div id="p-lunar-text" class="lunar-title"></div>
          <div id="p-ganzhi-text" class="lunar-sub"></div>
          <div id="p-week-stats" class="lunar-stats"></div>

          <div class="divider"></div>

          <div class="tag-row">
            <span class="label-tag bg-red">生肖</span><span id="v-sx">--</span>
          </div>
          <div class="tag-row">
            <span class="label-tag bg-purple">星座</span
            ><span id="v-xz">--</span>
          </div>
          <div class="tag-row">
            <span class="label-tag bg-blue">节日</span><span id="v-jr">--</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 引入本地农历库 -->
    <script src="./js/lunar.js"></script>
    <script>
      /**
       * 1. 搜索引擎核心配置 (已修正搜索URL)
       */
      const ENGINE_MAP = {
        google: {
          name: "Google",
          search: "https://www.google.com/search?q=",
          home: "https://google.com",
          icon: "./icons/google.svg",
        },
        baidu: {
          name: "百度",
          search: "https://www.baidu.com/s?wd=",
          home: "https://baidu.com",
          icon: "./icons/baidu.svg",
        },
        bing: {
          name: "必应",
          search: "https://www.bing.com/search?q=",
          home: "https://bing.com",
          icon: "./icons/bing.svg",
        },
        metaso: {
          name: "秘塔 AI",
          search: "https://metaso.cn/?q=",
          home: "https://metaso.cn",
          icon: "./icons/metaso.svg",
        },
      };

      let activeEngineKey = "google";

      /* 2. 时间与自动农历逻辑 (增加元素存在性检查) */
      function updateTime() {
        const now = new Date();

        // 1. 更新时间 (HH:mm)
        const timeEl = document.getElementById("time");
        if (timeEl) {
          timeEl.innerText =
            now.getHours().toString().padStart(2, "0") +
            ":" +
            now.getMinutes().toString().padStart(2, "0");
        }

        // 2. 获取日期和星期
        const weeks = [
          "星期日",
          "星期一",
          "星期二",
          "星期三",
          "星期四",
          "星期五",
          "星期六",
        ];
        const dateStr = `${now.getMonth() + 1}月${now.getDate()}日`;
        const weekStr = weeks[now.getDay()];

        // 3. 获取农历
        let lunarStr = "获取中...";
        if (typeof Lunar !== "undefined") {
          const lunar = Lunar.fromDate(now);
          lunarStr = `${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}`;
        }

        // 4. 【关键修改】：注入三段式 HTML 结构，以适配 CSS 的 space-between 布局
        const dateInfoEl = document.getElementById("date-info");
        if (dateInfoEl) {
          dateInfoEl.innerHTML = `
            <span>${dateStr}</span>
            <span>${weekStr}</span>
            <span>${lunarStr}</span>
        `;
        }

        // 5. 更新卡片内的农历（保持不变）
        const cardLunarEl = document.getElementById("card-lunar");
        if (cardLunarEl) cardLunarEl.innerText = lunarStr;
      }

      /**
       * 3. 搜索功能逻辑 (添加元素存在性检查)
       */
      function setEngine(key) {
        if (!ENGINE_MAP[key]) return;
        activeEngineKey = key;
        const config = ENGINE_MAP[key];
        const iconEl = document.getElementById("engine-icon");
        if (iconEl) iconEl.src = config.icon;
        const inputEl = document.getElementById("search-input");
        if (inputEl) inputEl.placeholder = `在 ${config.name} 中搜索...`;
        const menuEl = document.getElementById("engine-menu");
        if (menuEl) menuEl.style.display = "none";
      }

      function handleSearch() {
        const val = document.getElementById("search-input")?.value.trim();
        const config = ENGINE_MAP[activeEngineKey];
        if (val) {
          window.open(config.search + encodeURIComponent(val), "_blank");
        } else {
          window.open(config.home, "_blank");
        }
      }

      function toggleEngineMenu(e) {
        if (e && e.stopPropagation) e.stopPropagation();
        const menu = document.getElementById("engine-menu");
        if (menu)
          menu.style.display =
            menu.style.display === "block" ? "none" : "block";
      }

      function clearInput() {
        const input = document.getElementById("search-input");
        if (input) {
          input.value = "";
          input.focus();
        }
      }

      /**
       * 4. 面板切换逻辑 (底部导航) - 无需修改，保持原样
       */
      function showTab(tabId, el) {
        document
          .querySelectorAll(".content-panel")
          .forEach((p) => p.classList.remove("active"));
        document
          .querySelectorAll(".nav-item")
          .forEach((i) => i.classList.remove("active"));
        const target = document.getElementById(tabId);
        if (target) target.classList.add("active");
        if (el) el.classList.add("active");
      }

      /**
       * 5. 弹窗逻辑 - 无需修改
       */
      function openModal(title, body) {
        document.getElementById("modal-title").innerText = title;
        document.getElementById("modal-body").innerHTML = body;
        document.getElementById("modal").style.display = "flex";
      }

      function closeModal() {
        document.getElementById("modal").style.display = "none";
      }

      /**
       * 6. 初始化与事件绑定 (增加元素存在性检查)
       */
      document.addEventListener("DOMContentLoaded", () => {
        setInterval(updateTime, 1000);
        updateTime();

        setEngine("google");

        window.addEventListener("click", () => {
          const menu = document.getElementById("engine-menu");
          if (menu) menu.style.display = "none";
        });

        const searchInput = document.getElementById("search-input");
        if (searchInput) {
          searchInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              handleSearch();
            }
          });
        }
      });
      /**
       *日历(2)，计算日期
       */
      /**
       * 1. 首页基础数据更新 (时间、撕页小卡片)
       * 每秒运行一次
       */
      function updateAllData() {
        const now = new Date();

        // 更新首页大时间 (HH:mm)
        const timeEl = document.getElementById("time");
        if (timeEl) {
          timeEl.innerText =
            now.getHours().toString().padStart(2, "0") +
            ":" +
            now.getMinutes().toString().padStart(2, "0");
        }

        // 更新首页日历小卡片
        if (typeof Lunar !== "undefined") {
          const lunarNow = Lunar.fromDate(now);

          // 年份月份/日期数字
          const ymEl = document.getElementById("cal-year-month");
          if (ymEl)
            ymEl.innerText = `${now.getFullYear()}年${now.getMonth() + 1}月`;
          const dEl = document.getElementById("cal-day-num");
          if (dEl) dEl.innerText = now.getDate();

          // 离过年天数计算
          const nextYear = lunarNow.getYear() + 1;
          const nextNewYear = Lunar.fromYmd(nextYear, 1, 1);
          const solarDate = nextNewYear.getSolar();
          const nextDate = new Date(
            solarDate.getYear(),
            solarDate.getMonth() - 1,
            solarDate.getDay(),
          );
          const daysLeft = Math.ceil(
            (nextDate.getTime() - now.getTime()) / 86400000,
          );

          const nyEl = document.getElementById("cal-to-newyear");
          if (nyEl) nyEl.innerText = `离过年 ${daysLeft} 天`;

          // 周数
          const start = new Date(now.getFullYear(), 0, 1);
          const past = Math.floor((now - start) / 86400000);
          const week = Math.ceil((past + start.getDay() + 1) / 7);
          const wkEl = document.getElementById("cal-week-of-year");
          if (wkEl) wkEl.innerText = `第${week}周`;

          // 底部农历/星期
          const weeks = [
            "周日",
            "周一",
            "周二",
            "周三",
            "周四",
            "周五",
            "周六",
          ];
          const clEl = document.getElementById("card-lunar");
          if (clEl)
            clEl.innerText = `${lunarNow.getMonthInChinese()}月${lunarNow.getDayInChinese()}`;
          const wdEl = document.getElementById("cal-weekday");
          if (wdEl) wdEl.innerText = weeks[now.getDay()];
        }
      }

      // 启动首页定时器
      setInterval(updateAllData, 1000);
      updateAllData();

      //** 2. 万年历弹窗逻辑
      // 【新增】定义全局变量，跟踪当前显示的年和月
      let currentViewDate = new Date();

      // 打开弹窗的主入口
      function openCalendarDetail() {
        const modal = document.getElementById("calendar-modal");
        if (!modal || typeof Lunar === "undefined") return;

        // 每次打开弹窗时，重置为“今天”
        currentViewDate = new Date();

        // 执行统一渲染函数
        renderCalendarUI();

        modal.style.display = "flex";
      }

      // 【新增】统一渲染函数：同时刷新左侧网格和右侧详情
      function renderCalendarUI() {
        const year = currentViewDate.getFullYear();
        const month = currentViewDate.getMonth() + 1;
        const day = currentViewDate.getDate();

        // 1. 生成左侧 7x6 网格
        renderCalendarGrid(year, month, day);
        // 2. 刷新右侧面板 (传入当前选中的日期对象)
        updateRightPanel(currentViewDate);
      }

      // 修改后的网格生成逻辑：支持跨月切换
      function renderCalendarGrid(year, month, activeDay) {
        const wrapper = document.getElementById("calendar-days-wrapper");
        if (!wrapper) return;
        wrapper.innerHTML = "";

        const firstDay = new Date(year, month - 1, 1).getDay();
        const lastDate = new Date(year, month, 0).getDate();

        // 补齐上个月日期 (点击可跳转)
        for (let i = firstDay; i > 0; i--) {
          const d = new Date(year, month - 1, 1 - i);
          const cell = document.createElement("div");
          cell.className = "day-cell other-month";
          cell.innerText = d.getDate();
          cell.onclick = () => {
            changeMonth(-1);
          }; // 点击切换到上个月
          wrapper.appendChild(cell);
        }

        // 生成本月日期
        for (let i = 1; i <= lastDate; i++) {
          const dateObj = new Date(year, month - 1, i);
          const l = Lunar.fromDate(dateObj);
          const s = l.getSolar();
          // --- 核心判断逻辑 ---
          const dayOfWeek = dateObj.getDay(); // 0 是周日，6 是周六
          const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
          const festivals = [...l.getFestivals(), ...s.getFestivals()];
          const isFestival = festivals.length > 0;
          // 农历显示逻辑
          const lText =
            l.getDayInChinese() === "初一"
              ? l.getMonthInChinese() + "月"
              : l.getDayInChinese();

          const cell = document.createElement("div");
          // 如果是今天，可以加个特殊的 today-mark 样式
          const isRealToday =
            new Date().toDateString() === dateObj.toDateString();
          // 拼接类名：如果是周末或节日，添加 'is-red' 类
          let classNames = `day-cell ${i === activeDay ? "current" : ""} ${isRealToday ? "today-mark" : ""}`;
          if (isWeekend || isFestival) {
            classNames += " is-red";
          }
          cell.className = classNames;
          cell.innerHTML = `<span>${i}</span><span class="lunar-small">${isFestival ? festivals[0] : lText}</span>`;

          cell.onclick = () => {
            document
              .querySelectorAll(".day-cell.current")
              .forEach((el) => el.classList.remove("current"));
            cell.classList.add("current");
            currentViewDate = dateObj;
            updateRightPanel(dateObj);
          };
          wrapper.appendChild(cell);
        }

        // 补齐下个月日期 (点击可跳转)
        const nextDays = 42 - (firstDay + lastDate);
        for (let i = 1; i <= nextDays; i++) {
          const cell = document.createElement("div");
          cell.className = "day-cell other-month";
          cell.innerText = i;
          cell.onclick = () => {
            changeMonth(1);
          };
          wrapper.appendChild(cell);
        }

        // 更新背景水印和标题
        if (document.getElementById("m-deco-month"))
          document.getElementById("m-deco-month").innerText = month;
        if (document.getElementById("m-year-month"))
          document.getElementById("m-year-month").innerText =
            `${year}年${String(month).padStart(2, "0")}月`;
      }

      // 【新增】切换月份逻辑 (offset 为 1 或 -1)
      function changeMonth(offset) {
        currentViewDate.setMonth(currentViewDate.getMonth() + offset);
        renderCalendarUI();
      }

      // 【新增】监听滚轮事件实现滑动切换
      // 请在页面初始化时调用此绑定，或者直接写在 openCalendarDetail 里
      document.getElementById("calendar-days-wrapper").onwheel = function (e) {
        e.preventDefault();
        if (e.deltaY > 0)
          changeMonth(1); // 向下滚，下个月
        else changeMonth(-1); // 向上滚，上个月
      };

      // 刷新右侧详情面板的函数 (保持不变，已确保去掉多余的“二〇”)
      function updateRightPanel(dateObj) {
        try {
          const lunar = Lunar.fromDate(dateObj);
          const solar = lunar.getSolar();

          document.getElementById("p-full-date").innerText =
            `${solar.getYear()}-${String(solar.getMonth()).padStart(2, "0")}-${String(solar.getDay()).padStart(2, "0")} 周${lunar.getWeekInChinese()}`;
          document.querySelector(".day-number").innerText = solar.getDay();

          document.getElementById("p-lunar-text").innerText =
            `${lunar.getYearInChinese()}年${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}`;
          document.getElementById("p-ganzhi-text").innerText =
            `${lunar.getYearInGanZhi()}(${lunar.getYearShengXiao()})年`;

          const start = new Date(dateObj.getFullYear(), 0, 1);
          const diffDays = Math.floor((dateObj - start) / 86400000) + 1;
          const weekNum = Math.ceil((diffDays + start.getDay()) / 7);
          document.getElementById("p-week-stats").innerText =
            `本年第${weekNum}周，第${diffDays}天`;

          document.getElementById("v-sx").innerText = lunar.getYearShengXiao();
          document.getElementById("v-xz").innerText = solar.getXingZuo();
          const fests = [...lunar.getFestivals(), ...solar.getFestivals()];
          document.getElementById("v-jr").innerText = fests.join("、") || "无";
        } catch (err) {
          console.error("更新右侧面板失败:", err);
        }
      }


      // 下班倒计时(4)
      function updateWorkStatus() {
        const now = new Date();
        const hour = now.getHours();
        const minute = now.getMinutes();
        const second = now.getSeconds();

        const currentSeconds = hour * 3600 + minute * 60 + second;
        const workStart = 7 * 3600 + 30 * 60; // 07:30
        const workEnd = 17 * 3600; // 17:00

        const titleEl = document.getElementById("status-title");
        const timerEl = document.getElementById("status-timer");
        const imgEl = document.getElementById("status-img");

        if (currentSeconds >= workStart && currentSeconds < workEnd) {
          titleEl.innerText = "离下班";
          imgEl.src = "./icons/onwork.webp";

          const remain = workEnd - currentSeconds;
          const h = Math.floor(remain / 3600)
            .toString()
            .padStart(2, "0");
          const m = Math.floor((remain % 3600) / 60)
            .toString()
            .padStart(2, "0");
          const s = (remain % 60).toString().padStart(2, "0");
          timerEl.innerText = `${h}:${m}:${s}`;
          timerEl.style.display = "block";
        } else {
          titleEl.innerText = "休息中";
          imgEl.src = "./icons/offwork.webp";
          timerEl.innerText = "";
          timerEl.style.display = "none"; // 左右分栏后，这里隐藏不会导致下方的方块错位或塌陷
        }

        // 发薪日
        const lastDay = new Date(
          now.getFullYear(),
          now.getMonth() + 1,
          0,
        ).getDate();
        const daysToPay = lastDay - now.getDate();
        document.getElementById("count-payday").innerText =
          daysToPay === 0 ? "今天！" : daysToPay + "天";

        // 周六倒计时
        const dayOfWeek = now.getDay();
        let daysToSat = (6 - dayOfWeek + 7) % 7;
        if (daysToSat === 0 && hour >= 17) daysToSat = 7;
        document.getElementById("count-sat").innerText =
          daysToSat === 0 ? "明天" : daysToSat + "天";
      }

      setInterval(updateWorkStatus, 1000);
      updateWorkStatus();
      
      // 定义主题数组（包含默认、暗夜、落日极光暮色（Sunset Serenity）, 深邃极光北欧绿（Nordic Aurora））
      const themes = ['default', 'dark', 'warm', 'green'];

      function rotateTheme() {
        const body = document.body;
        // 获取当前激活的主题，若没有属性则默认为 'default'
        let currentTheme = body.getAttribute('data-theme') || 'default';
        
        // 计算下一个主题的索引
        let nextIndex = (themes.indexOf(currentTheme) + 1) % themes.length;
        let nextTheme = themes[nextIndex];
        
        // 应用新主题
        if (nextTheme === 'default') {
          body.removeAttribute('data-theme');
        } else {
          body.setAttribute('data-theme', nextTheme);
        }
        
        // 记住用户的选择
        localStorage.setItem('user-selected-theme', nextTheme);
      }

      // 页面加载时自动读取缓存，恢复主题
      document.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('user-selected-theme');
        if (savedTheme && savedTheme !== 'default') {
          document.body.setAttribute('data-theme', savedTheme);
        }
      });
    </script>
    <script src="./js/Weather.js"></script>
    <script src="./js/trending.js"></script>
    <script src="./js/panels.js"></script>
  </body>
