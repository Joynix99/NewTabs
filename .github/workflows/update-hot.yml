name: Update Hot List
on:
  schedule:
    # 每3小时更新
    - cron: "0 */3 * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # =====================================
      # Checkout（已升级至 v5，完美原生支持 Node 24，彻底消除警告）
      # =====================================
      - name: Checkout
        uses: actions/checkout@v5
      # =====================================
      # 创建 data 目录
      # =====================================
      - name: Create data dir
        run: mkdir -p data
      # =====================================
      # 财联社
      # =====================================
      - name: Fetch CLS
        run: |
          # 1. 抓取数据（使用完整的真实浏览器 User-Agent）
          curl --silent --show-error --fail --max-time 20 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "https://cls.cn" -o cls_raw.json
          
          # 2. 使用 Python 脚本进行安全解析和字段降级兼容
          python3 <<EOF
          import json
          import os

          try:
              with open("cls_raw.json", "r", encoding="utf-8") as f:
                  raw_data = json.load(f)
              
              items = []
              telegraphs = raw_data.get("data", {}).get("telegraphs", [])
              
              if not telegraphs:
                  telegraphs = raw_data.get("data", {}).get("roll_data", [])

              for item in telegraphs:
                  title = item.get("content") or item.get("title") or "无标题"
                  title = title[:100] + "..." if len(title) > 100 else title
                  
                  item_id = item.get("id")
                  url = f"https://cls.cn{item_id}" if item_id else "https://cls.cn"
                  
                  items.append({"title": title, "url": url})
              
              with open("data/cls.json", "w", encoding="utf-8") as f:
                  json.dump(items, f, ensure_ascii=False, indent=2)
                  
              print(f"成功解析财联社数据，共 {len(items)} 条。")

          except Exception as e:
              print(f"解析出错: {e}")
              if os.path.exists("cls_raw.json"):
                  with open("cls_raw.json", "r", encoding="utf-8") as f:
                      print("原始数据前500字:", f.read()[:500])
              with open("data/cls.json", "w", encoding="utf-8") as f:
                  json.dump([], f)
          EOF
      # =====================================
      # IT之家
      # =====================================
      - name: Fetch ITHome
        run: |
          curl --silent --show-error --fail --max-time 20 -A "Mozilla/5.0" "https://ithome.com" -o ithome.xml
          python3 <<EOF
          import xml.etree.ElementTree as ET
          import json
          tree = ET.parse("ithome.xml")
          root = tree.getroot()
          items = []
          for item in root.findall("./channel/item")[:10]:
              title = item.findtext("title", "")
              link = item.findtext("link", "")
              items.append({"title": title, "url": link})
          with open("data/ithome.json", "w", encoding="utf-8") as f:
              json.dump(items, f, ensure_ascii=False, indent=2)
          EOF
      # =====================================
      # B站热门
      # =====================================
      - name: Fetch Bilibili
        run: |
          curl --silent --show-error --fail --max-time 20 -A "Mozilla/5.0" "https://bilibili.com" -o bilibili_raw.json
          jq '.data.list | map({title: .title, url: ("https://bilibili.com" + .bvid)})' bilibili_raw.json > data/bilibili.json
      # =====================================
      # V2EX 热门
      # =====================================
      - name: Fetch V2EX
        run: |
          curl --silent --show-error --fail --max-time 20 -A "Mozilla/5.0" "https://v2ex.com" -o v2ex_raw.json
          jq 'map({title: .title, url: ("https://v2ex.com" + (.id|tostring))})' v2ex_raw.json > data/v2ex.json
      # =====================================
      # JSON 校验
      # =====================================
      - name: Validate JSON
        run: |
          for file in data/*.json; do
            if [ ! -s "$file" ]; then
              echo "Empty file: $file"
              exit 1
            fi
          done
      # =====================================
      # Commit
      # =====================================
      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "update hot list"
          git push
