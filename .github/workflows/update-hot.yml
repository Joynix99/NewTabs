name: Update Hot List
on:
  schedule:
    # 每6小时更新
    - cron: "0 */6 * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # =====================================
      # Checkout
      # =====================================
      - name: Checkout
        uses: actions/checkout@v4
      # =====================================
      # 创建 data 目录
      # =====================================
      - name: Create data dir
        run: mkdir -p data
      # =====================================
      # B站热门
      # =====================================
      - name: Fetch Bilibili
        run: |
          curl --silent --show-error --fail --max-time 20 -A "Mozilla/5.0" "https://api.bilibili.com/x/web-interface/popular" -o bilibili_raw.json
          jq '.data.list | map({title: .title, url: ("https://www.bilibili.com/video/" + .bvid)})' bilibili_raw.json > data/bilibili.json
      # =====================================
      # HackerNews
      # =====================================
      - name: Fetch HackerNews
        run: |
          curl --silent --show-error --fail --max-time 20 "https://hacker-news.firebaseio.com/v0/topstories.json" -o hn_ids.json
          python3 <<EOF
          import json
          import requests
          HEADERS = {
              "User-Agent": "Mozilla/5.0"
          }
          with open("hn_ids.json", "r") as f:
              ids = json.load(f)[:10]
          items = []
          for i in ids:
              try:
                  url = f"https://hacker-news.firebaseio.com/v0/item/{i}.json"
                  data = requests.get(url, headers=HEADERS, timeout=10).json()
                  items.append({
                      "title": data.get("title", "No title"),
                      "url": data.get("url", "https://news.ycombinator.com")
                  })
              except Exception as e:
                  print(e)
          with open("data/hackernews.json", "w", encoding="utf-8") as f:
              json.dump(items, f, ensure_ascii=False, indent=2)
          EOF
      # =====================================
      # V2EX 热门
      # =====================================
      - name: Fetch V2EX
        run: |
          curl --silent --show-error --fail --max-time 20 -A "Mozilla/5.0" "https://www.v2ex.com/api/topics/hot.json" -o v2ex_raw.json
          jq 'map({title: .title, url: ("https://www.v2ex.com/t/" + (.id|tostring))})' v2ex_raw.json > data/v2ex.json
      # =====================================
      # JSON 校验
      # =====================================
      - name: Validate JSON
        run: |
          for file in data/*.json; do
            if [ ! -s "$file" ]; then
              echo "Empty file: $file"
              exit 1
            fi
          done
      # =====================================
      # Commit
      # =====================================
      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "update hot list"
          git push
