name: Update Hot List
on:
  schedule:
    # 每3小时更新
    - cron: "0 */3 * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create data dir
        run: mkdir -p data

      # =====================================
      # 高穿透率防封锁数据引擎
      # =====================================
      - name: Fetch and Parse All Hot Lists
        run: |
          python3 <<EOF
          import json
          import xml.etree.ElementTree as ET
          import urllib.request
          import re
          import os
          import time

          # 制造高级别的真实浏览器伪装指纹
          def get_safe_data(url, referer="https://google.com"):
              headers = {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8",
                  "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
                  "Referer": referer,
                  "Cache-Control": "max-age=0",
                  "Connection": "keep-alive"
              }
              # 最多重试 3 次，防止瞬时网络波动
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=20) as response:
                          return response.read()
                  except Exception as e:
                      print(f"请求失败(尝试 {attempt+1}/3) [{url}]: {e}")
                      time.sleep(2)
              return b""

          # -------------------------------------
          # 1. 财联社原生网页解析（注入标准 Referer 伪装）
          # -------------------------------------
          cls_items = []
          html_data = get_safe_data("https://cls.cn", "https://cls.cn")
          if html_data:
              try:
                  html_content = html_data.decode("utf-8", errors="ignore")
                  titles = re.findall(r'<div[^>]*class="[^"]*telegraph-content[^"]*"[^>]*>(.*?)</div>', html_content, re.DOTALL)
                  ids = re.findall(r'/detail/(\d+)', html_content)
                  for i, raw_title in enumerate(titles[:10]):
                      title = re.sub(r'<[^>]+>', '', raw_title).strip()
                      title = title.replace('&quot;', '"').replace('&amp;', '&').replace('&lt;', '<').replace('&gt;', '>')
                      item_id = ids[i] if i < len(ids) else "0"
                      url = f"https://cls.cndetail/{item_id}" if item_id != "0" else "https://cls.cn"
                      if title: cls_items.append({"title": title[:100], "url": url})
              except Exception as e: print(f"财联社清洗错误: {e}")
          
          # 容错：如果网页被 WAF 完全拦截，退回尝试读取极速 API
          if not cls_items:
              api_data = get_safe_data("https://cls.cnapi/sw/v1/telegraphs?refresh_type=1&rn=10", "https://cls.cn")
              if api_data:
                  try:
                      res_j = json.loads(api_data.decode("utf-8"))
                      for item in res_j.get("data", {}).get("telegraphs", [])[:10]:
                          t = item.get("content") or item.get("title") or ""
                          i_id = item.get("id")
                          if t and i_id: cls_items.append({"title": t[:100], "url": f"https://cls.cndetail/{i_id}"})
                  except: pass

          if not cls_items: cls_items = [{"title": "财联社电报数据暂无更新 (接口风控中)", "url": "https://cls.cn"}]
          with open("data/cls.json", "w", encoding="utf-8") as f: json.dump(cls_items, f, ensure_ascii=False, indent=2)

          # -------------------------------------
          # 2. IT之家 RSS 极速拉取
          # -------------------------------------
          ithome_items = []
          xml_data = get_safe_data("https://ithome.com", "https://ithome.com")
          if xml_data:
              try:
                  root = ET.fromstring(xml_data)
                  for item in root.findall("./channel/item")[:10]:
                      title = item.findtext("title", "").strip()
                      link = item.findtext("link", "").strip()
                      if title: ithome_items.append({"title": title, "url": link})
              except Exception as e: print(f"IT之家解析错误: {e}")
          if not ithome_items: ithome_items = [{"title": "IT之家热点同步中...", "url": "https://ithome.com"}]
          with open("data/ithome.json", "w", encoding="utf-8") as f: json.dump(ithome_items, f, ensure_ascii=False, indent=2)

          # -------------------------------------
          # 3. B站热门（使用非高危移动端特定无防护源）
          # -------------------------------------
          bili_items = []
          bili_raw = get_safe_data("https://bilibili.com", "https://bilibili.com")
          if not bili_raw: # 备用经典热门榜
              bili_raw = get_safe_data("https://bilibili.com", "https://bilibili.com")
          if bili_raw:
              try:
                  res_json = json.loads(bili_raw.decode("utf-8"))
                  # 兼容多套榜单节点结构
                  video_list = res_json.get("data", {}).get("list", []) or res_json.get("data", {}).get("list", [])
                  for item in video_list[:10]:
                      title = item.get("title", "").strip()
                      bvid = item.get("bvid", "")
                      if title and bvid: bili_items.append({"title": title, "url": f"https://bilibili.comvideo/{bvid}"})
              except Exception as e: print(f"B站解析错误: {e}")
          if not bili_items: bili_items = [{"title": "B站热门视频同步中...", "url": "https://bilibili.com"}]
          with open("data/bilibili.json", "w", encoding="utf-8") as f: json.dump(bili_items, f, ensure_ascii=False, indent=2)

          # -------------------------------------
          # 4. V2EX 热门解析
          # -------------------------------------
          v2ex_items = []
          v2ex_raw = get_safe_data("https://v2ex.com", "https://v2ex.com")
          if v2ex_raw:
              try:
                  res_json = json.loads(v2ex_raw.decode("utf-8"))
                  for item in res_json[:10]:
                      title = item.get("title", "").strip()
                      item_id = item.get("id", "")
                      if title and item_id: v2ex_items.append({"title": title, "url": f"https://v2ex.comt/{item_id}"})
              except Exception as e: print(f"V2EX解析错误: {e}")
          if not v2ex_items: v2ex_items = [{"title": "V2EX今日热议加载中...", "url": "https://v2ex.com"}]
          with open("data/v2ex.json", "w", encoding="utf-8") as f: json.dump(v2ex_items, f, ensure_ascii=False, indent=2)

          print("数据清洗流执行完毕。")
          EOF

      # =====================================
      # JSON 校验
      # =====================================
      - name: Validate JSON
        run: |
          for file in data/*.json; do
            if [ ! -s "$file" ]; then
              echo "Empty file: $file"
              exit 1
            fi
          done

      # =====================================
      # Commit 提交
      # =====================================
      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "update hot list"
          git push
