name: Update Hot List
on:
  schedule:
    # 每3小时更新
    - cron: "0 */3 * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # =====================================
      # Checkout
      # =====================================
      - name: Checkout
        uses: actions/checkout@v4
      # =====================================
      # 创建 data 目录
      # =====================================
      - name: Create data dir
        run: mkdir -p data
      # =====================================
      # 财联社
      # =====================================
      - name: Fetch CLS
        run: |
          curl --silent --show-error --fail --max-time 20 -A "Mozilla/5.0" "https://www.cls.cn/nodeapi/updateTelegraphList?lastTime=0&pageSize=10" -o cls_raw.json
          jq '.data.roll_data | map({title: .title, url: ("https://www.cls.cn/detail/" + (.id|tostring))})' cls_raw.json > data/cls.json
      # =====================================
      # IT之家
      # =====================================
      - name: Fetch ITHome
        run: |
          curl --silent --show-error --fail --max-time 20 -A "Mozilla/5.0" "https://www.ithome.com/rss/" -o ithome.xml
          python3 <<EOF
          import xml.etree.ElementTree as ET
          import json
          tree = ET.parse("ithome.xml")
          root = tree.getroot()
          items = []
          for item in root.findall("./channel/item")[:10]:
              title = item.findtext("title", "")
              link = item.findtext("link", "")
              items.append({"title": title, "url": link})
          with open("data/ithome.json", "w", encoding="utf-8") as f:
              json.dump(items, f, ensure_ascii=False, indent=2)
          EOF
      # =====================================
      # B站热门
      # =====================================
      - name: Fetch Bilibili
        run: |
          curl --silent --show-error --fail --max-time 20 -A "Mozilla/5.0" "https://api.bilibili.com/x/web-interface/popular" -o bilibili_raw.json
          jq '.data.list | map({title: .title, url: ("https://www.bilibili.com/video/" + .bvid)})' bilibili_raw.json > data/bilibili.json
      # =====================================
      # V2EX 热门
      # =====================================
      - name: Fetch V2EX
        run: |
          curl --silent --show-error --fail --max-time 20 -A "Mozilla/5.0" "https://www.v2ex.com/api/topics/hot.json" -o v2ex_raw.json
          jq 'map({title: .title, url: ("https://www.v2ex.com/t/" + (.id|tostring))})' v2ex_raw.json > data/v2ex.json
      # =====================================
      # JSON 校验
      # =====================================
      - name: Validate JSON
        run: |
          for file in data/*.json; do
            if [ ! -s "$file" ]; then
              echo "Empty file: $file"
              exit 1
            fi
          done
      # =====================================
      # Commit
      # =====================================
      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "update hot list"
          git push
