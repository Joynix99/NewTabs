name: Update Hot List
on:
  schedule:
    # 每3小时更新一次
    - cron: "0 */3 * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create data dir
        run: mkdir -p data

      # =====================================
      # 1. B站热门（官方API）
      # =====================================
      - name: Fetch Bilibili
        run: |
          curl --silent --show-error --fail --max-time 20 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            "https://api.bilibili.com/x/web-interface/popular" -o bilibili_raw.json
          jq '.data.list | map({title: .title, url: ("https://www.bilibili.com/video/" + .bvid)})' \
            bilibili_raw.json > data/bilibili.json

      # =====================================
      # 2. IT之家（官方RSS）
      # =====================================
      - name: Fetch ITHome
        run: |
          curl --silent --show-error --fail --max-time 20 \
            -A "Mozilla/5.0" "https://www.ithome.com/rss/" -o ithome.xml
          python3 <<EOF
          import xml.etree.ElementTree as ET
          import json
          
          tree = ET.parse("ithome.xml")
          root = tree.getroot()
          items = []
          for item in root.findall("./channel/item")[:10]:
              title = item.findtext("title", "")
              link = item.findtext("link", "")
              if title and link:
                  items.append({"title": title, "url": link})
          
          with open("data/ithome.json", "w", encoding="utf-8") as f:
              json.dump(items, f, ensure_ascii=False, indent=2)
          EOF

      # =====================================
      # 3. V2EX热门（官方API）
      # =====================================
      - name: Fetch V2EX
        run: |
          curl --silent --show-error --fail --max-time 20 \
            "https://www.v2ex.com/api/topics/hot.json" -o v2ex_raw.json
          jq 'map({title: .title, url: ("https://www.v2ex.com/t/" + (.id|tostring))})' \
            v2ex_raw.json > data/v2ex.json

      # =====================================
      # 4. 财联社（官方快讯接口）
      # =====================================
      - name: Fetch CLS
        run: |
          curl --silent --show-error --fail --max-time 20 \
            -A "Mozilla/5.0" \
            "https://www.cls.cn/nodeapi/telegraphList" -o cls_raw.json
          python3 <<EOF
          import json
          
          with open("cls_raw.json", "r") as f:
              data = json.load(f)
          
          items = []
          for item in data.get("data", [])[:10]:
              title = item.get("title", "")
              if title:
                  items.append({
                      "title": title,
                      "url": f"https://www.cls.cn/detail/{item.get('id', '')}"
                  })
          
          with open("data/cls.json", "w", encoding="utf-8") as f:
              json.dump(items, f, ensure_ascii=False, indent=2)
          EOF

      # =====================================
      # 5. HackerNews（备用稳定源）
      # =====================================
      - name: Fetch HackerNews
        run: |
          curl --silent --show-error --fail --max-time 20 \
            "https://hacker-news.firebaseio.com/v0/topstories.json" -o hn_ids.json
          python3 <<EOF
          import json
          import urllib.request
          
          with open("hn_ids.json", "r") as f:
              ids = json.load(f)[:10]
          
          items = []
          for story_id in ids:
              try:
                  url = f"https://hacker-news.firebaseio.com/v0/item/{story_id}.json"
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read())
                      items.append({
                          "title": data.get("title", "No title"),
                          "url": data.get("url", f"https://news.ycombinator.com/item?id={story_id}")
                      })
              except Exception as e:
                  print(f"Error fetching {story_id}: {e}")
          
          with open("data/hackernews.json", "w", encoding="utf-8") as f:
              json.dump(items, f, ensure_ascii=False, indent=2)
          EOF

      # =====================================
      # JSON 校验
      # =====================================
      - name: Validate JSON
        run: |
          for file in data/*.json; do
            if [ ! -s "$file" ]; then
              echo "❌ Empty file: $file"
              exit 1
            fi
            echo "✅ $file: $(cat $file | jq 'length') items"
          done

      # =====================================
      # Commit 提交
      # =====================================
      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "update hot list $(date '+%Y-%m-%d %H:%M:%S')"
          git push
