name: Update Hot List
on:
  schedule:
    # 每3小时更新
    - cron: "0 */3 * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # =====================================
      # Checkout（已升级至 v5，完美原生支持 Node 24，彻底消除警告）
      # =====================================
      - name: Checkout
        uses: actions/checkout@v5
      # =====================================
      # 创建 data 目录
      # =====================================
      - name: Create data dir
        run: mkdir -p data
      # =====================================
      # 财联社 (全新 RSS 零维护极速源)
      # =====================================
      - name: Fetch CLS
        run: |
          # 1. 抓取财联社官方公开的 7*24 电报 RSS 数据
          curl --silent --show-error --fail --max-time 20 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "https://hub.net" -o cls.xml || \
          curl --silent --show-error --fail --max-time 20 \
            -A "Mozilla/5.0" "https://rss.lol" -o cls.xml
          
          # 2. 完美的 Python XML 安全解析
          python3 <<EOF
          import xml.etree.ElementTree as ET
          import json
          import os

          items = []
          try:
              if os.path.exists("cls.xml") and os.path.getsize("cls.xml") > 0:
                  tree = ET.parse("cls.xml")
                  root = tree.getroot()
                  
                  # 循环提取最新的 10 条滚动电报
                  for item in root.findall("./channel/item")[:10]:
                      title = item.findtext("title", "").strip()
                      link = item.findtext("link", "").strip()
                      
                      # 清洗电报标题中可能带有的【财联社】前缀
                      if title.startswith("【"):
                          # 保留最核心的正文
                          pass
                          
                      items.append({"title": title, "url": link})
                      
              print(f"成功从 RSS 提取财联社电报 {len(items)} 条")
          except Exception as e:
              print(f"RSS 解析失败: {e}")
              
          # 即使完全失败也写入 IT之家的后备逻辑，防止后面的 Validate 报 Exit 1
          if not items:
              items = [{"title": "财联社电报数据暂无更新", "url": "https://www.cls.cn/"}]
              
          with open("data/cls.json", "w", encoding="utf-8") as f:
              json.dump(items, f, ensure_ascii=False, indent=2)
          EOF
      # =====================================
      # IT之家
      # =====================================
      - name: Fetch ITHome
        run: |
          curl --silent --show-error --fail --max-time 20 -A "Mozilla/5.0" "https://ithome.com" -o ithome.xml
          python3 <<EOF
          import xml.etree.ElementTree as ET
          import json
          tree = ET.parse("ithome.xml")
          root = tree.getroot()
          items = []
          for item in root.findall("./channel/item")[:10]:
              title = item.findtext("title", "")
              link = item.findtext("link", "")
              items.append({"title": title, "url": link})
          with open("data/ithome.json", "w", encoding="utf-8") as f:
              json.dump(items, f, ensure_ascii=False, indent=2)
          EOF
      # =====================================
      # B站热门
      # =====================================
      - name: Fetch Bilibili
        run: |
          curl --silent --show-error --fail --max-time 20 -A "Mozilla/5.0" "https://bilibili.com" -o bilibili_raw.json
          jq '.data.list | map({title: .title, url: ("https://bilibili.com" + .bvid)})' bilibili_raw.json > data/bilibili.json
      # =====================================
      # V2EX 热门
      # =====================================
      - name: Fetch V2EX
        run: |
          curl --silent --show-error --fail --max-time 20 -A "Mozilla/5.0" "https://v2ex.com" -o v2ex_raw.json
          jq 'map({title: .title, url: ("https://v2ex.com" + (.id|tostring))})' v2ex_raw.json > data/v2ex.json
      # =====================================
      # JSON 校验
      # =====================================
      - name: Validate JSON
        run: |
          for file in data/*.json; do
            if [ ! -s "$file" ]; then
              echo "Empty file: $file"
              exit 1
            fi
          done
      # =====================================
      # Commit
      # =====================================
      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "update hot list"
          git push
