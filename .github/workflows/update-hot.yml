name: Update Hot List
on:
  schedule:
    # 每3小时更新
    - cron: "0 */3 * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # =====================================
      # Checkout
      # =====================================
      - name: Checkout
        uses: actions/checkout@v4
      # =====================================
      # 创建 data 目录
      # =====================================
      - name: Create data dir
        run: mkdir -p data
      # =====================================
      # 财联社
      # =====================================
      - name: Fetch CLS
        run: |
          # 1. 抓取数据（使用完整的真实浏览器 User-Agent）
          curl --silent --show-error --fail --max-time 20 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "https://cls.cn" -o cls_raw.json
          
          # 2. 使用 Python 脚本进行安全解析和字段降级兼容
          python3 <<EOF
          import json
          import os

          try:
              # 读取下载的原始 JSON
              with open("cls_raw.json", "r", encoding="utf-8") as f:
                  raw_data = json.load(f)
              
              items = []
              # 兼容新版 API 的 .data.telegraphs 节点
              telegraphs = raw_data.get("data", {}).get("telegraphs", [])
              
              # 如果新节点不存在，尝试兼容旧版的 .data.roll_data 节点
              if not telegraphs:
                  telegraphs = raw_data.get("data", {}).get("roll_data", [])

              for item in telegraphs:
                  # 优先提取新版的 content 字段，其次是旧版的 title 字段
                  title = item.get("content") or item.get("title") or "无标题"
                  # 截取前 100 个字防止作为标题过长
                  title = title[:100] + "..." if len(title) > 100 else title
                  
                  item_id = item.get("id")
                  url = f"https://cls.cn{item_id}" if item_id else "https://cls.cn"
                  
                  items.append({"title": title, "url": url})
              
              # 确保最终写入目标文件
              with open("data/cls.json", "w", encoding="utf-8") as f:
                  json.dump(items, f, ensure_ascii=False, indent=2)
                  
              print(f"成功解析财联社数据，共 {len(items)} 条。")

          except Exception as e:
              print(f"解析出错: {e}")
              # 打印部分原始数据方便你在 Actions 日志中排查
              if os.path.exists("cls_raw.json"):
                  with open("cls_raw.json", "r", encoding="utf-8") as f:
                      print("原始数据前500字:", f.read()[:500])
              # 写入空数组防止后续的 Validate 步骤崩溃
              with open("data/cls.json", "w", encoding="utf-8") as f:
                  json.dump([], f)
          EOF
      # =====================================
      # IT之家
      # =====================================
      - name: Fetch ITHome
        run: |
          curl --silent --show-error --fail --max-time 20 -A "Mozilla/5.0" "https://www.ithome.com/rss/" -o ithome.xml
          python3 <<EOF
          import xml.etree.ElementTree as ET
          import json
          tree = ET.parse("ithome.xml")
          root = tree.getroot()
          items = []
          for item in root.findall("./channel/item")[:10]:
              title = item.findtext("title", "")
              link = item.findtext("link", "")
              items.append({"title": title, "url": link})
          with open("data/ithome.json", "w", encoding="utf-8") as f:
              json.dump(items, f, ensure_ascii=False, indent=2)
          EOF
      # =====================================
      # B站热门
      # =====================================
      - name: Fetch Bilibili
        run: |
          curl --silent --show-error --fail --max-time 20 -A "Mozilla/5.0" "https://api.bilibili.com/x/web-interface/popular" -o bilibili_raw.json
          jq '.data.list | map({title: .title, url: ("https://www.bilibili.com/video/" + .bvid)})' bilibili_raw.json > data/bilibili.json
      # =====================================
      # V2EX 热门
      # =====================================
      - name: Fetch V2EX
        run: |
          curl --silent --show-error --fail --max-time 20 -A "Mozilla/5.0" "https://www.v2ex.com/api/topics/hot.json" -o v2ex_raw.json
          jq 'map({title: .title, url: ("https://www.v2ex.com/t/" + (.id|tostring))})' v2ex_raw.json > data/v2ex.json
      # =====================================
      # JSON 校验
      # =====================================
      - name: Validate JSON
        run: |
          for file in data/*.json; do
            if [ ! -s "$file" ]; then
              echo "Empty file: $file"
              exit 1
            fi
          done
      # =====================================
      # Commit
      # =====================================
      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "update hot list"
          git push
